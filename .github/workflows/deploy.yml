name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: sewain-web-${{ github.ref }}
  cancel-in-progress: false

env:
  SITE_URL: https://sewain.hallojanu.me

jobs:
  test:
    name: Typecheck, lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ env.SITE_URL }}

  image:
    name: Build & push image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ env.SITE_URL }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Thinkpad server
    needs: image
    if: github.event_name != 'pull_request' && github.repository_owner == 'mrfroglab'
    runs-on: self-hosted
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull & restart
        run: |
          COMPOSE=/opt/stacks/apps/sewain/docker-compose.yml
          docker compose -f "$COMPOSE" pull web
          docker compose -f "$COMPOSE" up -d --no-deps web
          docker image prune -f
      - name: Verify container is healthy
        run: |
          for _ in $(seq 1 40); do
            s=$(docker inspect -f '{{.State.Health.Status}}' sewain-web 2>/dev/null || true)
            if [ "$s" = healthy ]; then
              docker exec sewain-web node -e "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" \
                && { echo "sewain-web healthy and rendering on :3000"; exit 0; }
            fi
            sleep 3
          done
          echo "sewain-web is not healthy. Check: docker logs sewain-web" >&2
          docker logs --tail 50 sewain-web >&2 || true
          exit 1
