name: CI/CD

# main    → image :latest  → stack demo    /opt/stacks/apps/sewain          (sewain.hallojanu.me)
# develop → image :develop → stack staging /opt/stacks/apps/sewain-staging  (sewain-staging.hallojanu.me)
on:
  push:
    branches: [main, develop]
    tags: ["v*"]   # rilis produksi: image :vX.Y.Z + :prod (SITE_URL dari variabel repo PROD_SITE_URL) → deploy-prod
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: sewain-web-${{ github.ref }}
  cancel-in-progress: false

env:
  SITE_URL: ${{ startsWith(github.ref, 'refs/tags/v') && vars.PROD_SITE_URL || (github.ref == 'refs/heads/develop' && 'https://sewain-staging.hallojanu.me' || 'https://sewain.hallojanu.me') }}

jobs:
  test:
    name: Typecheck, lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ env.SITE_URL }}

  image:
    name: Build & push image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Production build needs PROD_SITE_URL
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          PROD_SITE_URL: ${{ vars.PROD_SITE_URL }}
        run: test -n "$PROD_SITE_URL" || { echo "::error::Set repo variable PROD_SITE_URL (mis. https://sewain.me) sebelum tag rilis"; exit 1; }
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=semver,pattern={{version}}
            type=raw,value=prod,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ env.SITE_URL }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Thinkpad server
    needs: image
    if: >-
      github.event_name != 'pull_request' && github.repository_owner == 'mrfroglab' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: self-hosted
    env:
      STACK: ${{ github.ref == 'refs/heads/main' && '/opt/stacks/apps/sewain' || '/opt/stacks/apps/sewain-staging' }}
      CONTAINER: ${{ github.ref == 'refs/heads/main' && 'sewain-web' || 'sewain-staging-web' }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull & restart
        run: |
          COMPOSE="$STACK/docker-compose.yml"
          docker compose -f "$COMPOSE" pull web
          docker compose -f "$COMPOSE" up -d --no-deps web
          docker image prune -f
      - name: Verify container is healthy
        run: |
          for _ in $(seq 1 40); do
            s=$(docker inspect -f '{{.State.Health.Status}}' "$CONTAINER" 2>/dev/null || true)
            if [ "$s" = healthy ]; then
              docker exec "$CONTAINER" node -e "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" \
                && { echo "$CONTAINER healthy and rendering on :3000"; exit 0; }
            fi
            sleep 3
          done
          echo "$CONTAINER is not healthy. Check: docker logs $CONTAINER" >&2
          docker logs --tail 50 "$CONTAINER" >&2 || true
          exit 1

  deploy-prod:
    name: Deploy PRODUCTION (tag rilis)
    needs: image
    if: >-
      github.event_name == 'push' && github.repository_owner == 'mrfroglab' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: self-hosted
    environment: production
    env:
      STACK: /opt/stacks/apps/sewain-prod
      CONTAINER: sewain-prod-web
    steps:
      - name: Stack must exist (sewain-api deploy/prod/setup.sh)
        run: test -f "$STACK/docker-compose.yml" || { echo "::error::$STACK belum dipasang"; exit 1; }
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull & restart
        run: |
          COMPOSE="$STACK/docker-compose.yml"
          docker compose -f "$COMPOSE" pull web
          docker compose -f "$COMPOSE" up -d --no-deps web
      - name: Verify container is healthy
        run: |
          for _ in $(seq 1 40); do
            s=$(docker inspect -f '{{.State.Health.Status}}' "$CONTAINER" 2>/dev/null || true)
            if [ "$s" = healthy ]; then echo "$CONTAINER healthy"; exit 0; fi
            sleep 3
          done
          echo "$CONTAINER is not healthy. Check: docker logs $CONTAINER" >&2
          docker logs --tail 50 "$CONTAINER" >&2 || true
          exit 1
